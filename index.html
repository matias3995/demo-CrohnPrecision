<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROHN-PRECISION · Plan nutricional adaptativo en Crohn</title>
<meta name="description" content="Prototipo de investigación educativo: plataforma de apoyo a decisiones nutricionales para profesionales que atienden pacientes con enfermedad de Crohn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23164E49'/%3E%3Cpath d='M11 6c0 7 10 8 10 15 0 3-1.5 4.5-2 5M21 6c0 7-10 8-10 15 0 3 1.5 4.5 2 5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --petrol:#164E49;--petrol-2:#1E625C;--sage:#83A99B;--mint:#E4F4ED;--mint-2:#F1F9F5;
  --ivory:#FAFBF8;--white:#FFFFFF;--ink:#243332;--muted:#74817D;--sand:#F1E9DC;--sand-2:#F8F3EA;
  --warn:#D99A55;--warn-bg:#FBF1E5;--danger:#B4483C;--danger-bg:#FBEDEA;--blue:#6E8796;--blue-bg:#EEF2F4;
  --line:#E5EAE7;--line-2:#EEF1EF;
  --r:16px;--r-sm:10px;
  --sh:0 1px 2px rgba(22,78,73,.04),0 6px 20px rgba(22,78,73,.05);
  --sh-h:0 2px 4px rgba(22,78,73,.05),0 12px 28px rgba(22,78,73,.08);
  --font:'Inter','DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Manrope','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--ivory);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
h4{font-size:14.5px;font-weight:700}
p{margin:0}
a{color:var(--petrol)}
.muted{color:var(--muted)}.small{font-size:12.5px}.xs{font-size:11.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.strong{font-weight:600}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 22px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--petrol);display:grid;place-items:center;color:#fff}
.brand-name{font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:14.5px;color:var(--petrol);line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#9AA5A1;padding:14px 12px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:#5E6B67;font:inherit;font-weight:500;cursor:pointer;position:relative;border:0;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:var(--mint-2);color:var(--petrol)}
.nav-item.active{background:var(--mint);color:var(--petrol);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--petrol)}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--warn-bg);color:#9A6428;border-radius:20px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line-2)}
.side-foot .doc{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sand);color:var(--petrol);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding:0 28px;background:rgba(250,251,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1}
.topbar .menu-btn{display:none}
.psel{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px}
.psel select{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:5px 4px;outline:none;cursor:pointer;min-width:120px}
.disclaimer{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#8A6A44;background:var(--sand-2);border:1px solid #EADFCC;border-radius:20px;padding:5px 11px;white-space:nowrap}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s}
.saved.on{opacity:1;color:var(--petrol)}
.content{padding:28px 32px 60px;max-width:1320px;width:100%;margin:0 auto}
.view{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Components ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--sage);font-weight:700;margin-bottom:6px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card.hover{transition:transform .18s ease,box-shadow .18s ease}
.card.hover:hover{transform:translateY(-1px);box-shadow:var(--sh-h)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h .t{display:flex;align-items:center;gap:10px}
.ic-box{width:34px;height:34px;border-radius:10px;background:var(--mint);color:var(--petrol);display:grid;place-items:center;flex:none}
.ic-box.sand{background:var(--sand);color:#8A6A44}.ic-box.blue{background:var(--blue-bg);color:var(--blue)}.ic-box.warn{background:var(--warn-bg);color:#A86A2A}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.sep{height:1px;background:var(--line-2);margin:16px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:13.5px;border-radius:11px;padding:9px 15px;border:1px solid transparent;cursor:pointer;transition:background .15s,box-shadow .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--petrol);color:#fff}
.btn-primary:hover{background:var(--petrol-2);box-shadow:0 4px 14px rgba(22,78,73,.22)}
.btn-soft{background:var(--mint);color:var(--petrol)}
.btn-soft:hover{background:#D6EEE3}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--sage);color:var(--petrol)}
.btn-danger{background:#fff;color:var(--danger);border-color:#EBCFCA}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn-icon{padding:7px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap;line-height:1.4;border:1px solid transparent}
.chip.ok{background:var(--mint);color:var(--petrol)}
.chip.low{background:var(--sand);color:#86602F}
.chip.high{background:var(--warn-bg);color:#A0611F}
.chip.nd{background:#F0F2F1;color:#6F7A77;border-color:#E2E6E4;border-style:dashed}
.chip.interp{background:var(--blue-bg);color:#4F6878}
.chip.soft{background:#F4F6F5;color:#55625E}
.chip.urg{background:var(--danger-bg);color:var(--danger)}
.chip.ev-clin{background:#E1F0EA;color:#1D5D55}
.chip.ev-obs{background:var(--blue-bg);color:#4F6878}
.chip.ev-exp{background:var(--sand-2);color:#8A6A44;border-color:#ECE2D0}
.chip.ev-data{background:#F0F2F1;color:#6F7A77}
.chip.p-urg{background:var(--danger-bg);color:var(--danger)}
.chip.p-high{background:var(--warn-bg);color:#A0611F}
.chip.p-med{background:var(--mint-2);color:var(--petrol);border-color:#D5ECE1}
.chip.p-low{background:#F4F6F5;color:#6F7A77}
.chip.rv-pendiente{background:#fff;color:var(--muted);border-color:var(--line)}
.chip.rv-aprobada,.chip.rv-editada{background:var(--petrol);color:#fff}
.chip.rv-rechazada{background:#F4F6F5;color:#8B9592;text-decoration:line-through}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:#4B5855}
.field .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(131,169,155,.18)}
input:disabled{background:#F6F7F6;color:#A3ACA9}
.invalid{border-color:var(--warn)!important;box-shadow:0 0 0 3px rgba(217,154,85,.15)!important}
.input-unit{position:relative}
.input-unit input{padding-right:48px}
.input-unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;background:#fff}
.check:hover{border-color:var(--sage)}
.check input{accent-color:var(--petrol);width:16px;height:16px;margin:0;flex:none}
.check:has(input:checked){background:var(--mint-2);border-color:#BFDCCF}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.radio-card{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff;transition:border-color .15s,background .15s}
.radio-card input{accent-color:var(--petrol);margin-top:3px}
.radio-card:has(input:checked){border-color:var(--petrol);background:var(--mint-2)}
.radio-card b{display:block;font-size:13px}
.radio-card span{font-size:11.5px;color:var(--muted)}

/* Notices */
.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;font-size:13px;border:1px solid}
.notice .i{margin-top:1px}
.notice.info{background:var(--mint-2);border-color:#D5ECE1;color:#2C5650}
.notice.sand{background:var(--sand-2);border-color:#ECE2D0;color:#6F5638}
.notice.warn{background:var(--warn-bg);border-color:#F1D8BA;color:#7E4E1C}
.notice.urg{background:var(--danger-bg);border-color:#EFC9C2;color:#7D2E25}
.notice.blue{background:var(--blue-bg);border-color:#DDE5EA;color:#3E5767}
.notice b{font-weight:700}

/* Tabs */
.tabs{display:inline-flex;gap:4px;background:#F0F3F1;padding:4px;border-radius:12px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.tab:hover{color:var(--petrol)}
.tab.active{background:#fff;color:var(--petrol);box-shadow:0 1px 3px rgba(22,78,73,.1)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.step-pill{display:flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 13px 7px 8px;border-radius:30px;cursor:pointer}
.step-pill .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#F0F3F1;font-size:11.5px}
.step-pill.active{border-color:var(--petrol);color:var(--petrol)}
.step-pill.active .n{background:var(--petrol);color:#fff}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:11px 14px;background:#FBFCFB;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{transition:background .12s}
.t tbody tr:hover{background:#FBFDFC}
.t input,.t select{padding:6px 8px;font-size:13px;border-radius:8px}
.t .w-num{width:92px}.t .w-date{width:140px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:12px}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;color:var(--ink);line-height:1}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .d{font-size:12px;color:var(--petrol);display:flex;align-items:center;gap:5px}

/* Hero / demo card */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.demo-card{background:linear-gradient(160deg,#164E49 0%,#1F5F58 100%);color:#fff;border-radius:var(--r);padding:24px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.demo-card h3{color:#fff;font-size:18px}
.demo-card p{color:#CFE3DB;margin:8px 0 18px;font-size:13.5px}
.demo-card .btn{background:#fff;color:var(--petrol)}
.demo-card .btn:hover{background:var(--mint)}
.demo-card .rings{position:absolute;right:-50px;bottom:-60px;opacity:.16}
.demo-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.demo-steps span{font-size:11px;background:rgba(255,255,255,.12);border-radius:20px;padding:3px 9px;color:#E4F4ED}

/* Patient header */
.phead{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px}
.phead-id{display:flex;align-items:center;gap:12px}
.phead-id .avatar{width:44px;height:44px;border-radius:13px;background:var(--mint);font-size:13px}
.phead-code{font-family:var(--display);font-weight:800;font-size:17px}
.phead-tags{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.phead-progress{min-width:150px}
.bar{height:6px;background:#EEF2F0;border-radius:6px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--petrol));border-radius:6px;transition:width .5s ease}

/* Recommendations */
.rec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;transition:box-shadow .18s}
.rec::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.rec.p-urg::before{background:var(--danger)}.rec.p-high::before{background:var(--warn)}.rec.p-med::before{background:var(--sage)}.rec.p-low::before{background:#C9D2CE}
.rec.p-urg{border-color:#EFC9C2;background:#FFFBFA}
.rec:hover{box-shadow:var(--sh)}
.rec-h{display:flex;gap:12px;align-items:flex-start}
.rec-icon{width:32px;height:32px;border-radius:9px;background:var(--mint-2);color:var(--petrol);display:grid;place-items:center;flex:none}
.rec.p-urg .rec-icon{background:var(--danger-bg);color:var(--danger)}
.rec.p-high .rec-icon{background:var(--warn-bg);color:#A86A2A}
.rec-t{flex:1;min-width:0}
.rec-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rec-reason{margin:12px 0 0;color:#4B5855;font-size:13px}
.rec-sec{margin-top:12px}
.rec-sec .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.rec-sec p{font-size:13.5px}
ul.trig{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
ul.trig li{font-size:12px;background:#F5F7F6;border:1px solid var(--line-2);border-radius:8px;padding:3px 8px;color:#4B5855}
.rec-warn{display:flex;gap:8px;margin-top:12px;background:var(--sand-2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:#6F5638}
.rec-warn ul{margin:0;padding-left:16px}
.rec-refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ref-link{font-size:11.5px;color:var(--petrol);background:#fff;border:1px solid var(--line);border-radius:7px;padding:2px 8px;text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.ref-link:hover{border-color:var(--sage)}
.rev{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.rev .btns{display:flex;gap:6px;flex-wrap:wrap}
.rev .btn.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}

/* Priority cards */
.prio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.prio{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:7px;animation:fadeUp .3s ease}
.prio .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.prio p{font-size:12.5px;color:var(--muted)}

/* Lab cards */
.lab-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lab-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lab-card .n{font-size:12px;color:var(--muted);font-weight:600}
.lab-card .v{font-family:var(--display);font-size:22px;font-weight:700}
.lab-card .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.lab-card.nd .v{color:#AAB3B0}

/* Gene cards */
.gene-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gene{display:flex;flex-direction:column;gap:12px;padding:18px}
.gene-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gene-name{font-family:var(--display);font-weight:800;font-size:18px;color:var(--petrol)}
.gene-geno{display:grid;grid-template-columns:1fr 100px;gap:8px}
.gene-geno select,.gene-geno input{padding:7px 9px;font-size:12.5px}
.gene.reg{border-color:#BFDCCF;background:linear-gradient(180deg,#F6FBF8 0,#fff 90px)}
.gene dl{margin:0;display:grid;gap:8px}
.gene dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.gene dd{margin:2px 0 0;font-size:12.8px;color:#3D4B48}
.gene-refs{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line-2)}
.helix{display:flex;gap:3px;align-items:flex-end;height:26px}
.helix i{width:4px;border-radius:3px;background:var(--sage);opacity:.75;animation:hx 2.4s ease-in-out infinite}
@keyframes hx{0%,100%{height:30%}50%{height:100%}}

/* Supplement cards */
.supp{display:flex;flex-direction:column;gap:10px}
.supp dl{margin:0;display:grid;gap:9px}
.supp dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.supp dd{margin:2px 0 0;font-size:13px}

/* Charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:10.5px;fill:#93A09B;font-family:var(--font)}
.chart .grid-l{stroke:#EEF1EF;stroke-width:1}
.chart .line{fill:none;stroke:var(--petrol);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.1s ease forwards}
.chart .area{opacity:0;animation:fadeIn .8s .4s ease forwards}
.chart .pt{fill:#fff;stroke:var(--petrol);stroke-width:2}
.chart .band{fill:var(--mint);opacity:.55}
.chart .bar-r{fill:var(--sage);transition:fill .15s}
.chart .bar-r:hover{fill:var(--petrol)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:3px;display:inline-block}
.metric-chips{display:flex;gap:6px;flex-wrap:wrap}
.metric-chips button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.metric-chips button.active{background:var(--petrol);border-color:var(--petrol);color:#fff}

/* Timeline */
.tl{list-style:none;margin:0;padding:0 0 0 6px;position:relative}
.tl::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 16px 34px}
.tl li::before{content:"";position:absolute;left:1px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--sage)}
.tl li.plan::before{border-color:var(--petrol)}.tl li.analisis::before{border-color:var(--blue)}.tl li.ajuste::before{border-color:var(--warn)}
.tl .d{font-size:11.5px;color:var(--muted)}

/* Activity */
.act{list-style:none;margin:0;padding:0}
.act li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.act li:last-child{border:0}
.act .ic-box{width:28px;height:28px;border-radius:8px}

/* Empty */
.empty{text-align:center;padding:50px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic-box{width:56px;height:56px;border-radius:16px;margin-bottom:6px}
.empty p{color:var(--muted);max-width:420px}

/* Library */
.lib-card{display:flex;flex-direction:column;gap:9px}
.lib-card .meta{font-size:12px;color:var(--muted)}
.lib-card h4{font-size:14px;line-height:1.35}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.kv dt{color:var(--muted);font-weight:600;margin:0}.kv dd{margin:0}

/* Report */
.report{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:44px 52px;box-shadow:var(--sh);max-width:900px;margin:0 auto}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:2px solid var(--petrol);margin-bottom:24px}
.rep-head .brand-name{font-size:16px}
.rep-sec{margin-bottom:24px;break-inside:avoid}
.rep-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--petrol);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.rep-sec h3 .num{width:22px;height:22px;border-radius:6px;background:var(--mint);display:grid;place-items:center;font-size:11px}
.rep-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rep-table th{text-align:left;background:#F6F9F7;color:#4B5855;font-weight:600;padding:7px 10px;border:1px solid var(--line)}
.rep-table td{padding:7px 10px;border:1px solid var(--line);vertical-align:top}
.rep-rec{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;break-inside:avoid}
.rep-rec .row{gap:6px}
.rep-foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(36,51,50,.32);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fadeIn2 .18s ease}
@keyframes fadeIn2{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(22,78,73,.25);animation:pop .22s ease}
.modal.sm{width:min(440px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.modal-b{padding:18px 24px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 22px}

/* Toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:3px solid var(--petrol);box-shadow:var(--sh-h);border-radius:12px;padding:11px 15px;font-size:13px;max-width:380px;animation:pop .2s ease}
.toast.error{border-left-color:var(--warn)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}

/* Tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;line-height:1.4;padding:7px 10px;border-radius:8px;width:max-content;max-width:240px;z-index:60;pointer-events:none;text-transform:none;letter-spacing:0;white-space:normal}
.tip-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#EEF2F0;color:var(--muted);font-size:10px;font-weight:700;cursor:help;vertical-align:middle}

/* Tour */
.tour{position:fixed;right:24px;bottom:24px;z-index:150;width:380px;max-width:calc(100vw - 32px);background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(22,78,73,.28);border:1px solid var(--line);overflow:hidden;animation:pop .25s ease}
.tour-top{background:var(--petrol);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.tour-top .t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#BFDCD0;font-weight:700}
.tour-b{padding:16px 18px}
.tour-b h4{font-size:15.5px;margin-bottom:6px}
.tour-b p{font-size:13px;color:#4B5855}
.tour-prog{height:4px;background:#EEF2F0}
.tour-prog span{display:block;height:100%;background:var(--sage);transition:width .4s ease}
.tour-f{display:flex;justify-content:space-between;align-items:center;padding:0 18px 16px;gap:8px}
.tour-hl{position:relative;z-index:5;box-shadow:0 0 0 3px var(--sage),0 0 0 9px rgba(131,169,155,.22)!important;border-radius:14px;transition:box-shadow .3s}

/* Responsive */
.overlay{display:none}
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main,.hero{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--sh-h)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .overlay{display:block;position:fixed;inset:0;background:rgba(36,51,50,.25);z-index:35}
  .topbar .menu-btn{display:inline-flex}
  .topbar{padding:0 16px;gap:10px}
  .disclaimer .long{display:none}
  .content{padding:20px 16px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .report{padding:26px 20px}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr 1fr}
  .psel select{min-width:80px}
  .saved{display:none}
  .disclaimer .mid{display:none}
  .psel .xs{display:none}
  h1{font-size:23px}
  .tour{right:16px;bottom:16px}
}

/* Print */
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff;font-size:12px}
  .sidebar,.topbar,.no-print,.tour,.toasts,.overlay,.phead{display:none!important}
  .app{display:block}
  .content{padding:0;max-width:none}
  .report{border:0;box-shadow:none;padding:0;max-width:none}
  .view{animation:none}
  a{color:var(--ink);text-decoration:none}
}

/* ============================================================
   CROHN-PRECISION v2 · componentes longitudinales
   ============================================================ */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.print-only{display:none}
.sticky{position:sticky;top:84px}
.chip.xs{font-size:10.5px;padding:2px 7px}
.chip .dot{width:6px;height:6px}
.chip.ph{border-color:transparent}
.chip.ph.nd{border-style:dashed;border-color:#DCE1DF}
.chip.at.ok{background:var(--mint-2);color:var(--petrol);border-color:#D5ECE1}
.chip.rv-mas_datos,.chip.rv-mas_datos{background:var(--blue-bg);color:#4F6878}
.btn{min-height:36px}.btn-sm{min-height:32px}.btn-icon{min-width:32px;min-height:32px}
.linkbtn{border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--petrol);cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 2px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}
.bar.lg{height:8px}
.flash{animation:flashIn .9s ease}
@keyframes flashIn{0%{box-shadow:0 0 0 0 rgba(131,169,155,.0)}30%{box-shadow:0 0 0 6px rgba(131,169,155,.35)}100%{box-shadow:var(--sh)}}
.nav-item .badge.dot-b{background:var(--warn);color:#fff;padding:0 6px;font-size:13px;line-height:16px}

/* Estado del plan (indicador) */
.pstate{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:30px;border:1px solid;white-space:nowrap}
.pstate .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.pstate.ok{color:var(--petrol);background:var(--mint);border-color:#CBE6DA}
.pstate.ok .dot{animation:pulseDot 2.4s ease-in-out infinite}
.pstate.high{color:#9A5B17;background:var(--warn-bg);border-color:#F1D8BA}
.pstate.low{color:#86602F;background:var(--sand-2);border-color:#ECE2D0}
.pstate.nd{color:#6F7A77;background:#F4F6F5;border-color:#E2E6E4}
.pstate.sm{font-size:11.5px;padding:3px 9px}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(22,78,73,.25)}50%{box-shadow:0 0 0 5px rgba(22,78,73,0)}}

/* Encabezado de paciente */
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.phead-meta{display:grid;grid-template-columns:repeat(5,minmax(84px,1fr));gap:6px 18px}
.phead-meta>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.phead-meta>div>span:first-child{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.phead-meta b{font-size:13px;font-weight:600}
.phead-meta .chip{align-self:flex-start}
.phead-state{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mini-tl{list-style:none;margin:14px 0 0;padding:0;display:flex;gap:0;counter-reset:s}
.mini-tl li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11.5px;color:var(--muted);text-align:center}
.mini-tl li::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.mini-tl li:first-child::before{display:none}
.mini-tl li.done::before,.mini-tl li.cur::before{background:var(--sage)}
.mini-tl .b{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;position:relative;z-index:1;color:#fff}
.mini-tl li.done .b{background:var(--petrol);border-color:var(--petrol)}
.mini-tl li.cur .b{border-color:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.mini-tl li.done .l{color:var(--ink);font-weight:600}
.mini-tl li.cur .l{color:#9A5B17;font-weight:700}

/* Dashboard */
.hero2{display:grid;grid-template-columns:1fr;gap:22px;padding:28px 30px;margin-bottom:18px;background:linear-gradient(180deg,#fff 0,#FBFDFC 100%)}
.hero2-text{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 40px;align-items:end}
.hero2-text .eyebrow,.hero2-text .hero2-h,.hero2-text p{grid-column:1}
.hero2-text .pillars{grid-column:2;grid-row:1/4;margin-top:0}
.hero2-flow{border-top:1px solid var(--line-2);padding-top:18px}
.hero2-h{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 10px;color:var(--petrol)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.pillars div{border-top:2px solid var(--sage);padding-top:8px}
.pillars b{display:block;font-family:var(--display);font-size:13.5px;color:var(--petrol);letter-spacing:.02em;text-transform:uppercase}
.pillars span{font-size:12.5px;color:var(--muted)}
.flow-svg{width:100%;height:auto;display:block;overflow:visible}
.fv-in{fill:#fff;stroke:#CFE3DB;stroke-width:1.2}
.fv-in.gen{stroke-dasharray:4 3;stroke:#D9C7A6;fill:var(--sand-2)}
.fv-in-t{font:600 12.5px var(--font);fill:var(--ink)}
.fv-link{fill:none;stroke:#BFD6CC;stroke-width:1.4}
.fv-node{fill:#fff;stroke:#BFDCCF;stroke-width:1.4}
.fv-node.acc{fill:var(--petrol);stroke:var(--petrol)}
.fv-t{font:700 13px var(--display);fill:var(--ink)}
.fv-t.acc{fill:#fff}
.fv-k{font:800 10px var(--font);letter-spacing:.12em;fill:var(--sage)}
.fv-arrow{stroke:#83A99B;stroke-width:1.6;fill:none}
.fv-loop{fill:none;stroke:var(--petrol);stroke-width:1.6;stroke-dasharray:6 5;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.fv-loop-bg{fill:#fff;stroke:#CBE6DA}
.fv-loop-t{font:700 11.5px var(--font);fill:var(--petrol)}
.flow-m{display:none;list-style:none;margin:0;padding:0}
.flow-m li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px;font-weight:600;border-left:2px solid var(--line);margin-left:11px;padding-left:16px;position:relative}
.flow-m li span{position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpis .kpi{gap:8px;padding:16px}
.kpis .kpi .v{font-size:26px}
.kpis .kpi .l{font-size:12.5px;line-height:1.35}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.att li:last-child{border:0}
.att-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.att-ic.urg{background:var(--danger-bg);color:var(--danger)}.att-ic.high{background:var(--warn-bg);color:#A86A2A}.att-ic.interp{background:var(--blue-bg);color:var(--blue)}.att-ic.ok{background:var(--mint);color:var(--petrol)}.att-ic.nd{background:#F0F2F1;color:#6F7A77}
.att-t{flex:1;min-width:0;font-size:13px}
.att-t>div{margin-top:4px}
.att.compact li{padding:8px 0}

/* Resumen */
.value-band{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:18px;font-size:12.5px;font-weight:600}
.vb-i{background:var(--mint-2);color:var(--petrol);padding:4px 10px;border-radius:20px}
.vb-plus{color:var(--sage);font-weight:800}
.vb-arrow{color:var(--sage);display:inline-flex}
.vb-out{background:var(--petrol);color:#fff;padding:4px 12px;border-radius:20px}
.domains{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.domain{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.domain.gen{background:var(--sand-2);border-color:#ECE2D0}
.dh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dh .ic-box{width:28px;height:28px;border-radius:8px}
.dh h4{display:flex;align-items:center;gap:8px}
.kv2{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px;align-items:start}
.kv2:last-of-type{border-bottom:0}
.kv2>span{color:var(--muted)}
.kv2>b{font-weight:600;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bm{display:inline-flex;align-items:center;gap:3px;background:#F5F7F6;border-radius:7px;padding:2px 7px;font-weight:500;font-size:11.5px}
.bm b{font-weight:700}
.obj-mini{display:grid;gap:12px}
.om .bar{margin-top:6px}
.bm-list{display:grid;gap:2px}
.bm-row{display:grid;grid-template-columns:1fr 110px 120px 110px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.bm-row:last-child{border:0}
.supp-mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.supp-mini li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex-wrap:wrap}
.supp-mini li>span:first-child{flex:1;min-width:110px}
.since{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.since-i{background:#F7FAF8;border:1px solid var(--line-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.since-i b{font-family:var(--display);font-size:19px;color:var(--petrol)}
.since-i span{font-size:11.5px;color:var(--muted)}
.since-i.warn{background:var(--warn-bg);border-color:#F1D8BA}.since-i.warn b{color:#9A5B17}
.need{list-style:none;margin:0;padding:0}
.need li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.need li:last-child{border:0}

/* Plan: encabezado */
.plan-head{padding:22px 24px}
.ph-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.ph-title{font-size:26px;display:flex;align-items:center;gap:10px}
.ph-title .ver{font-size:15px;background:var(--petrol);color:#fff;border-radius:9px;padding:3px 10px;letter-spacing:.02em}
.vsel{display:flex;gap:6px;flex-wrap:wrap}
.vchip{font:inherit;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.vchip .dot{width:7px;height:7px;border-radius:50%;background:#C9D2CE}
.vchip .dot.ok{background:var(--sage)}.vchip .dot.low{background:var(--warn)}.vchip .dot.high{background:var(--warn)}.vchip .dot.soft{background:#C9D2CE}
.vchip.on{border-color:var(--petrol);color:var(--petrol);background:var(--mint-2)}
.ph-meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:16px;padding:14px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.ph-meta>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.ph-meta span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.ph-meta b{font-size:13px;font-weight:600}
.ph-meta input{padding:5px 8px;font-size:13px;max-width:160px}
.ph-cta{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--mint-2);border:1px solid #D5ECE1;border-radius:12px;padding:12px 14px}
.ph-cta.warn{background:var(--warn-bg);border-color:#F1D8BA}
.ph-cta.muted-cta{background:#F6F7F6;border-color:var(--line)}
.ph-changes{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chg{font-size:12px;background:#fff;border:1px solid #CBE6DA;border-radius:8px;padding:3px 8px;font-weight:600}
.chg small{color:var(--muted);font-weight:500;margin-left:3px}

/* Objetivos */
.obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.obj{display:flex;flex-direction:column;gap:12px}
.obj h4{font-size:15px;line-height:1.3}
.obj-vals{display:grid;grid-template-columns:auto 16px auto 16px 1fr;gap:6px;align-items:end}
.obj-vals>div{display:flex;flex-direction:column;gap:2px}
.obj-vals span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.obj-vals b{font-family:var(--display);font-size:16px}
.obj-vals .arr{color:var(--sage);padding-bottom:3px}
.obj-q{font-size:13px;display:flex;gap:6px;align-items:center;color:var(--petrol);background:var(--mint-2);padding:8px 10px;border-radius:10px}

/* Alimentación */
.strat{margin-bottom:14px;background:linear-gradient(180deg,#F6FBF8,#fff)}
.strat h2{font-size:21px;color:var(--petrol)}
.nut-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.nut{padding:16px}
.nut-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.nut-h .ic-box{width:28px;height:28px;border-radius:8px}
.nut-h h4{font-size:13px}
.nut ul{margin:0;padding-left:16px;font-size:12.8px;display:grid;gap:5px;color:#3D4B48}
.nut.limitar .ic-box{background:var(--warn-bg);color:#A86A2A}
.nut.evitar .ic-box{background:var(--blue-bg);color:var(--blue)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

/* Pack */
.pack{background:linear-gradient(135deg,#FBFDFC 0,#F1F9F5 100%);border-color:#CFE3DB}
.pack-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.pack-brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;letter-spacing:.08em;color:var(--petrol);font-size:14px}
.pack-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pmod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px;text-align:center;position:relative;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.pmod:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.pm-cap{height:44px;display:grid;place-items:center;margin-bottom:8px}
.pm-cap span{width:22px;height:40px;border-radius:12px;background:linear-gradient(180deg,#D7E5DF 50%,#EEF3F1 50%);display:block;transform:rotate(30deg)}
.pmod.on{border-color:var(--petrol);box-shadow:0 0 0 1px var(--petrol) inset}
.pmod.on .pm-cap span{background:linear-gradient(180deg,var(--petrol) 50%,var(--sage) 50%)}
.pmod.prop{border-style:dashed;border-color:var(--warn)}
.pmod.prop .pm-cap span{background:linear-gradient(180deg,#E9B98A 50%,#F6E0C9 50%)}
.pmod.eval .pm-cap span{background:linear-gradient(180deg,#B9C9D3 50%,#E4EBEF 50%)}
.pmod.off{opacity:.62}
.pm-n{font-weight:700;font-size:13px}
.pm-s{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-top:4px;color:var(--muted)}
.pmod.on .pm-s{color:var(--petrol)}.pmod.prop .pm-s{color:#A0611F}
.pm-p{font-size:11.5px;color:var(--muted);margin-top:2px}
.legend2{display:flex;gap:6px;flex-wrap:wrap}

/* Suplementación: tarjetas */
.supp2{padding:0;overflow:hidden;border-left:4px solid var(--line)}
.supp2.is-active{border-left-color:var(--sage)}
.supp2.sev-alta.is-active{border-left-color:var(--warn)}
.s2-h{display:flex;justify-content:space-between;gap:14px;padding:16px 18px 0;flex-wrap:wrap}
.s2-h h4{font-size:16px}
.s2-conf{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.s2-conf span{font-size:11.5px;background:#F5F7F6;border:1px solid var(--line-2);border-radius:8px;padding:4px 8px;color:var(--muted)}
.s2-conf b{color:var(--ink);margin-left:3px}
.s2-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;padding:14px 18px}
.s2-grid>div>span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:3px}
.s2-grid p{font-size:13px;margin:0}
.s2-mini b{font-size:13px;font-weight:600}
.s2-missing{margin:0 18px 10px;font-size:12px;color:#4F6878;display:flex;gap:6px;align-items:center}
.factor{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:#8A6A44;background:var(--sand-2);border:1px dashed #E3D3B7;border-radius:8px;padding:4px 9px;margin:0 18px 10px}
.gene .factor{margin:0}
.phist{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 18px 10px;padding-top:8px;border-top:1px dashed var(--line)}
.ph-i{display:inline-flex;align-items:center;gap:5px}
.ph-i small{font-weight:700;color:var(--muted)}
.ph-a{color:var(--sage);display:inline-flex}
.s2-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:#FBFCFB;border-top:1px solid var(--line-2)}
.s2-by{padding:0 18px 12px;background:#FBFCFB}

/* Revisión y audit */
.flow3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--sage)}
.flow3 span{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:20px;background:#F4F6F5;color:var(--muted)}
.flow3 span.done{background:var(--petrol);color:#fff}
.flow3 span.cur{background:var(--warn-bg);color:#9A5B17}
.audit{list-style:none;margin:0;padding:0;display:grid;gap:0}
.audit li{display:grid;grid-template-columns:54px 92px 1fr;gap:8px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line-2);align-items:start}
.audit li:last-child{border:0}
.audit .ad{color:var(--muted);font-weight:600}
.audit .aa{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audit .aa.sys{background:var(--blue-bg);color:#4F6878}.audit .aa.pro{background:var(--mint);color:var(--petrol)}

/* Comparador */
.cmp-head{display:grid;grid-template-columns:1.2fr 1fr 24px 1fr;gap:10px;padding:0 12px 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cmp{display:grid;gap:6px}
.cmp-row{display:grid;grid-template-columns:1.2fr 1fr 24px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#FBFCFB;border:1px solid var(--line-2);transition:background .2s}
.cmp-row.chg{background:var(--mint-2);border-color:#CBE6DA}
.cmp-row.chg .cmp-arr{color:var(--petrol)}
.cmp-arr{color:#C9D2CE;display:flex;justify-content:center}
.cmp-a b{font-size:13px}
.vcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.vcard.on{border-color:var(--petrol);background:var(--mint-2)}
.trace{display:grid;gap:10px}
.trace>div{display:grid;grid-template-columns:170px 1fr;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.trace>div:last-child{border:0}
.trace span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding-top:2px}
.trace p{font-size:13px;margin:0}
.ev-ref{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}

/* Reevaluación */
.demo-sim{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,#164E49,#1F5F58);color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:16px}
.demo-sim h3{color:#fff;margin:6px 0 4px}
.demo-sim p{color:#CFE3DB;max-width:560px}
.demo-sim .btn{background:#fff;color:var(--petrol)}
.rc{display:grid;gap:4px}
.rc-row{display:grid;grid-template-columns:1.3fr 1.1fr 1fr 92px 96px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line-2);animation:fadeUp .35s ease both}
.rc-row:last-child{border:0}
.rc-row.stale{opacity:.6}
.rc-l{display:flex;flex-direction:column}
.rc-v{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:15px}
.rc-v .from{color:var(--muted)}
.rc-v svg{color:var(--sage)}
.rc-bars{display:grid;gap:3px}
.rc-bars span{display:block;height:6px;border-radius:4px;transition:width .8s ease}
.rc-bars .b0{background:#DCE3E0}
.rc-bars .b1{background:var(--sage)}
.rc-bars .b1.good{background:var(--petrol)}.rc-bars .b1.bad{background:var(--warn)}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 8px}
.trend.good{background:var(--mint);color:var(--petrol)}.trend.bad{background:var(--warn-bg);color:#9A5B17}.trend.neutral{background:var(--blue-bg);color:#4F6878}.trend.eq{background:#F4F6F5;color:var(--muted)}
.chg-card{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;animation:fadeUp .35s ease both}
.chg-card.ok{border-left-color:var(--sage)}.chg-card.high{border-left-color:var(--warn)}.chg-card.interp{border-left-color:var(--blue)}.chg-card.urg{border-left-color:var(--danger)}

/* Seguimiento */
.cycles{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.cyc{flex:1;min-width:200px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:3px}
.cyc.activo,.cyc.reevaluacion{border-color:var(--petrol);background:var(--mint-2)}
.cyc.pendiente{border-style:dashed;border-color:var(--warn)}
.cyc-v{font-family:var(--display);font-weight:800;color:var(--petrol);margin-top:4px}
.cyc-arr{display:grid;place-items:center;color:var(--sage)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.check.sm{padding:6px 10px;font-size:12.5px}
.tl li::before{display:none}
.tl-ic{position:absolute;left:-1px;top:0;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--sage);display:grid;place-items:center;color:var(--petrol)}
.tl li.plan .tl-ic,.tl li.ajuste .tl-ic{border-color:var(--petrol);background:var(--petrol);color:#fff}
.tl li.analisis .tl-ic{border-color:var(--blue);color:var(--blue)}
.tl li.reevaluacion .tl-ic,.tl li.suplementacion .tl-ic{border-color:var(--warn);color:#A86A2A}
.tl li{padding-left:38px}
.chart .mark-l{stroke:#D99A55;stroke-width:1.2;stroke-dasharray:3 3}
.chart .mark-t{font:700 10px var(--font);fill:#A86A2A}

/* Genética */
.how{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(180deg,#FBF8F2,#fff)}
.how-ic{width:44px;height:44px;border-radius:13px;background:var(--sand);color:#8A6A44;display:grid;place-items:center;flex:none}
.how p{margin:6px 0 10px;font-size:13.5px}
.how-steps{display:flex;gap:6px;flex-wrap:wrap}
.how-steps span{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;background:var(--mint-2);color:var(--petrol);padding:4px 9px;border-radius:20px}
.how-steps span.g{background:var(--sand-2);color:#8A6A44;border:1px dashed #E3D3B7}
.ev-group{margin-bottom:18px}
.ev-h{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.ev-empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}

/* Vista paciente */
body.pmode .sidebar{display:none}
body.pmode .app{grid-template-columns:1fr}
body.pmode .menu-btn{display:none!important}
.pv{max-width:560px;margin:0 auto;display:grid;gap:14px}
.pv-hero{background:linear-gradient(160deg,#164E49,#1F5F58);color:#fff;border-radius:22px;padding:24px}
.pv-hero h1{color:#fff;font-size:26px;margin:4px 0}
.pv-hero p{color:#CFE3DB}
.pv-next{margin-top:16px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pv-next b{font-family:var(--display);font-size:18px}
.pv-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.pv-card h3{margin-bottom:10px}
.pv-obj,.pv-prog,.pv-supp,.pv-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pv-obj li{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px;border-radius:12px;background:#F7FAF8}
.pv-obj li svg{color:var(--sage)}
.pv-obj li.alcanzado{background:var(--mint)}
.pv-obj li.alcanzado svg{color:var(--petrol)}
.pv-obj em{margin-left:auto;font-style:normal;font-weight:700;color:var(--petrol);font-size:12.5px}
.pv-prog li{display:flex;justify-content:space-between;font-size:14px;padding:10px 12px;border-radius:12px;background:#F7FAF8}
.pv-prog li b{display:inline-flex;gap:5px;align-items:center}
.pv-prog li.good b{color:var(--petrol)}.pv-prog li.bad b{color:#9A5B17}
.pv-supp li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:#F7FAF8;font-size:14px}
.pv-supp span{font-size:12.5px;color:var(--muted)}
.pv-supp small{font-size:12px;color:var(--petrol)}
.pv-list li{font-size:13.5px;padding-left:14px;position:relative}
.pv-list li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--sage)}

/* Carga */
.loading{position:fixed;inset:0;z-index:300;background:rgba(250,251,248,.72);backdrop-filter:blur(4px);display:grid;place-items:center;animation:fadeIn2 .15s ease}
.loading-box{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(22,78,73,.18);border-radius:18px;padding:20px 24px;font-size:14px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--mint);border-top-color:var(--petrol);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tour-dots{display:flex;gap:5px;padding:10px 18px 0}
.tour-dots span{flex:1;height:4px;border-radius:3px;background:#EEF2F0}
.tour-dots span.done{background:var(--sage)}.tour-dots span.cur{background:var(--petrol)}
.policy ul{margin:0;padding-left:18px;display:grid;gap:7px}
.spark{display:block}

/* Responsive */
@media (max-width:1250px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .phead{grid-template-columns:1fr;gap:14px}
  .phead-state{flex-direction:row;align-items:center;justify-content:space-between}
  .nut-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pack-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .hero2-text{grid-template-columns:1fr}
  .hero2-text .pillars{grid-column:1;grid-row:auto;margin-top:14px}
  .ph-meta{grid-template-columns:repeat(3,minmax(0,1fr))}
  .s2-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sticky{position:static}
}
@media (max-width:900px){
  .phead-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .domains{grid-template-columns:1fr}
  .rc-row{grid-template-columns:1.2fr 1fr 80px;}
  .rc-row .rc-bars,.rc-row .rc-s{display:none}
  .bm-row{grid-template-columns:1fr 90px 100px}
  .bm-row .spark{display:none}
  .cmp-head{display:none}
  .cmp-row{grid-template-columns:1fr 1fr 18px 1fr}
  .trace>div{grid-template-columns:1fr;gap:4px}
}
@media (max-width:700px){
  .flow-svg{display:none}
  .flow-m{display:block}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pillars{grid-template-columns:1fr}
  .hero2{padding:20px}
  .hero2-h{font-size:24px}
  .mini-tl .l{font-size:10px}
  .ph-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nut-grid,.s2-grid{grid-template-columns:1fr}
  .pack-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .since{grid-template-columns:repeat(2,1fr)}
  .cmp-row{grid-template-columns:1fr;gap:6px}
  .cmp-row .cmp-arr{justify-content:flex-start;transform:rotate(90deg);width:18px}
  .audit li{grid-template-columns:46px 1fr}
  .audit .at{grid-column:1/-1}
  .kv2{grid-template-columns:100px 1fr}
  .obj-vals{grid-template-columns:1fr 14px 1fr;}
  .obj-vals>div:nth-child(5){grid-column:1/-1}
  .obj-vals .arr:nth-child(4){display:none}
}
@media print{
  .print-only{display:block}
  .tour,.loading{display:none!important}
}

#compare .card-h{flex-wrap:wrap}
#compare .card-h .row{flex-wrap:nowrap}
#compare .card-h select{width:auto;max-width:240px}

/* ===== v3: plan longitudinal ===== */
.cyc-badge{display:inline-flex;align-items:center;font-family:var(--display);font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--petrol);background:var(--mint);border:1px solid #CBE6DA;border-radius:8px;padding:3px 9px;text-transform:uppercase}
.ph-title .cyc-badge{font-size:12px}
.ph-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:13px}
.sim-btn{box-shadow:0 4px 14px rgba(22,78,73,.22)}
.pack-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pmod.changed{box-shadow:0 0 0 3px rgba(217,154,85,.35);animation:popMod .6s ease}
@keyframes popMod{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.pm-chg{font-size:10.5px;color:#A0611F;margin-top:5px;font-weight:600}
.pack.compact{padding:14px;box-shadow:none}
.pack.compact .pack-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pack.compact .pmod{padding:10px 8px}
.pack.compact .pm-cap{height:30px;margin-bottom:4px}.pack.compact .pm-cap span{height:28px;width:16px}
.pack-cmp{display:grid;grid-template-columns:1fr 32px 1fr;gap:10px;align-items:center}
.pack-cmp-arr{color:var(--sage);display:grid;place-items:center}
.supp2 .s2-banner{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:7px 18px;background:var(--petrol);color:#fff}
.supp2 .s2-banner.prop{background:var(--warn-bg);color:#9A5B17}
.supp2.approved{border-left-color:var(--petrol)}
.s2-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-left:4px}
.s2-appr{background:var(--mint-2);border-radius:10px;padding:8px 10px;margin:-8px -10px}
.sys-prop{background:var(--blue-bg);border:1px solid #DDE5EA;border-radius:12px;padding:12px 14px}
.cmp-vers{display:flex;align-items:center;gap:14px;margin-bottom:14px;color:var(--sage)}
.cmp-vers>div{border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;color:var(--ink);flex:1}
.cmp-vers>div.b{border-color:var(--petrol);background:var(--mint-2)}
.cmp-vers span{font-size:12px;color:var(--muted)}
.cmp-row{grid-template-columns:1.2fr 1fr 24px 1fr}
.cmp-why{grid-column:1/-1;font-size:12.5px;color:#3D4B48;background:#fff;border:1px dashed #CBE6DA;border-radius:10px;padding:8px 11px;margin-top:4px}
.cmp-why span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--petrol);margin-bottom:2px}
.cmp-why em{font-style:normal;color:var(--muted)}
.phistory{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.phistory li{display:flex;gap:12px;align-items:center;padding:10px 0;position:relative}
.phistory li:not(:last-child)::after{content:"";position:absolute;left:17px;top:46px;bottom:-10px;width:2px;background:var(--line)}
.phistory .hn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;background:#F4F6F5;color:var(--muted);flex:none;position:relative;z-index:1}
.phistory .ph-v.activo .hn{background:var(--petrol);color:#fff}
.phistory .ph-v.pendiente .hn{background:var(--warn-bg);color:#9A5B17}
.phistory .ph-re .hn{background:var(--mint);color:var(--petrol);width:28px;height:28px;margin-left:4px}
.phistory .grow{flex:1;min-width:0}
.evo-card{background:linear-gradient(180deg,#F6FBF8,#fff)}
.evo-card h2{font-size:24px;color:var(--petrol)}
.evo-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.evo{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:evoIn .5s ease both}
@keyframes evoIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.evo-l{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ============================================================

const LS_KEY = 'crohn-precision.v2';
const LS_KEY_V1 = 'crohn-precision.v1';
const NOW = new Date();
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daysAgo = n => { const d = new Date(NOW); d.setDate(d.getDate() - n); return isoDate(d); };
const TODAY = isoDate(NOW);

/* ---------- Analitos (rangos de EJEMPLO, ficticios y editables) ---------- */
const ANALYTES = [
  { key: 'hb', name: 'Hemoglobina', unit: 'g/dL', low: 12, high: 16, min: 2, max: 25 },

  { key: 'mg', name: 'Magnesio', unit: 'mg/dL', low: 1.7, high: 2.4, min: 0, max: 10 },
  { key: 'k', name: 'Potasio', unit: 'mEq/L', low: 3.5, high: 5.1, min: 1, max: 10 },

  { key: 'egfr', name: 'Filtrado glomerular estimado', unit: 'mL/min/1,73 m²', low: 90, high: null, min: 1, max: 200 },
];
const ANALYTE = Object.fromEntries(ANALYTES.map(a => [a.key, a]));
const KEY_LABS = ['hb', 'ferritin', 'tsat', 'pcr', 'b12', 'vitd', 'alb'];

/* ---------- Catálogo genético ---------- */

  { key: 'inmune', label: 'Susceptibilidad y función intestinal' },
  { key: 'micro', label: 'Metabolismo de micronutrientes' },

  { key: 'interaccion', label: 'Interacciones gen-nutriente' },
  { key: 'microbiota', label: 'Microbiota y barrera intestinal' },
];
const V = (gene, rs, cat, o) => ({ id: rs.replace(/[^a-zA-Z0-9]/g, '_'), gene, rs, cat, refs: [], ...o });
const VARIANTS = [
  // Susceptibilidad e inmunidad
  V('NOD2', 'rs2066844', 'inmune', { alias: 'p.Arg702Trp (R702W)', func: 'Receptor intracelular que reconoce componentes de la pared bacteriana (muramil dipéptido) y participa en la inmunidad innata intestinal.', assoc: 'Asociación replicada con mayor susceptibilidad a Crohn, especialmente con compromiso ileal.', nutrient: 'Barrera intestinal · respuesta a microbiota', evidence: 'observacional', utility: 'Informa susceptibilidad. No orienta indicaciones dietarias, probióticos ni suplementos.' }),
  V('NOD2', 'rs2066845', 'inmune', { alias: 'p.Gly908Arg (G908R)', func: 'Variante del dominio rico en leucinas de NOD2, implicado en el reconocimiento bacteriano.', assoc: 'Asociada con susceptibilidad a Crohn en poblaciones de ascendencia europea.', nutrient: 'Barrera intestinal · respuesta a microbiota', evidence: 'observacional', utility: 'Informa susceptibilidad. Sin aplicación nutricional directa.' }),

  V('ATG16L1', 'rs2241880', 'inmune', { alias: 'p.Thr300Ala (T300A)', func: 'Proteína de la maquinaria de autofagia, relevante para la defensa frente a bacterias intracelulares y la función de células de Paneth.', assoc: 'Asociada con susceptibilidad a Crohn en estudios de asociación genómica.', nutrient: 'Autofagia · células de Paneth', evidence: 'observacional', utility: 'Informa mecanismos de enfermedad. No define dieta ni suplementos.' }),
  V('IL23R', 'rs11209026', 'inmune', { alias: 'p.Arg381Gln (R381Q)', func: 'Subunidad del receptor de IL-23, eje inmunitario IL-23/Th17.', assoc: 'El alelo menor se asocia con menor riesgo de EII en estudios genéticos.', nutrient: 'Eje inmunitario IL-23/Th17', evidence: 'observacional', utility: 'Informa vías inmunitarias. Sin aplicación nutricional directa.' }),
  V('IL23R', 'rs10889677', 'inmune', { alias: 'Región 3′ UTR', func: 'Variante en la región reguladora del receptor de IL-23.', assoc: 'Estudios de asociación con EII con resultados variables entre poblaciones.', nutrient: 'Eje inmunitario IL-23/Th17', evidence: 'exploratoria', utility: 'Exploratoria. No orienta decisiones clínicas.' }),

  V('VDR', 'rs2228570', 'micro', { alias: 'FokI', func: 'Receptor nuclear de vitamina D: media la acción del calcitriol sobre la expresión génica, incluida la respuesta inmunitaria y la barrera epitelial.', assoc: 'Asociaciones con EII y con marcadores de vitamina D inconsistentes entre poblaciones.', nutrient: 'Vitamina D', evidence: 'exploratoria', utility: 'No modifica por sí solo la indicación ni la dosis de vitamina D: la decisión se basa en el laboratorio y la clínica.' }),

  const other = ['espen2023', 'aga2024', 'ecco_anemia', 'ecco2024'];
  REFERENCES.filter(r => !used.has(r.id) && !other.includes(r.id) && !r.genes.length).forEach(r => issues.push({ lvl: 'aviso', msg: `Referencia sin vínculo con genes ni reglas: ${r.id}` }));
  return {
    genes: genes.length, genesDoc: genes.length - genesNoRef.length, variants: VARIANTS.length, variantsDoc: VARIANTS.length - varNoRef.length,

    warnings: ['Ninguna dieta sustituye la terapia médica.', 'No se restringen automáticamente gluten, lácteos, frutas ni verduras.'] });

    'Variantes relacionadas con el metabolismo del folato y la homocisteína.',
    'Interpretar el estado de folato con laboratorio y clínica.',
    ['No recomendar dosis especiales de folato ni tratamientos alternativos por el resultado genético.'], [],

    'Variantes con asociaciones observacionales o exploratorias, sin aplicación nutricional establecida.',

    ['No orientan suplementos, exclusiones ni dosis.'], ['li2016', 'petermann2009'].filter(r => genRegistered(p, r === 'li2016' ? ['SLC39A8'] : ['SLC22A4']).length));

  out.recs.sort((a, b) => PRIO[a.priority].o - PRIO[b.priority].o || a.resultGroup.localeCompare(b.resultGroup));
  return out;
}

  if (cur('vitd') != null) add('vitd', inCorr('vitd') ? Math.max(cur('vitd'), low('vitd') + 1) : cur('vitd') * 0.98);
  if (cur('ferritin') != null) add('ferritin', inCorr('iron') ? cur('ferritin') + 28 : cur('ferritin') * 0.97);
  if (cur('tsat') != null) add('tsat', inCorr('iron') ? cur('tsat') + 7 : cur('tsat'));
  if (cur('hb') != null) add('hb', cur('hb') + (inCorr('iron') || inCorr('b12') ? 0.3 : 0.1));
  if (cur('folate') != null) add('folate', inCorr('folate') ? low('folate') + 3.2 : cur('folate'));
  if (cur('zinc') == null) add('zinc', low('zinc') - 7); else add('zinc', inCorr('zinc') ? cur('zinc') + 14 : cur('zinc'));
  if (cur('mg') != null) add('mg', inCorr('mg') ? low('mg') + 0.2 : cur('mg'));
  if (cur('pcr') != null) add('pcr', cur('pcr') * 0.65);
  if (cur('calpro') != null) add('calpro', cur('calpro') * 0.25);
  if (cur('alb') != null) add('alb', cur('alb') + 0.1);
  const w = currentWeight(p);
  if (w) { const recov = plan.objectives.some(o => o.key === 'peso' && o.mode === 'recuperar'); const nw = r1(w.value + (recov ? 1.7 : 0.1)); p.followup.weight.push({ id: uid(), date, value: nw }); p.weight = nw; addTimeline(p, date, 'peso', `Peso ${num(nw)} kg (${recov ? '+' + num(r1(nw - plan.baseline.weight.value)) + ' kg en el ciclo' : 'estable'})`); }
  const s = currentSymptoms(p);
  if (s) { const ns = s.value >= 4 ? Math.max(2, Math.round(s.value * 0.45)) : s.value; p.followup.symptoms.push({ id: uid(), date, value: ns }); addTimeline(p, date, 'sintomas', `Síntomas ${ns}/10`); }
  (p.adherenceLog = p.adherenceLog || []).push({ id: uid(), date, general: 84, food: 76, supp: 92, tolerance: 'Buena', reasons: ['Olvido', 'Preferencias'] });
  p.followup.adherence.push({ id: uid(), date, value: 84 });

  addAudit(p, date, 'Sistema', 'Nueva analítica incorporada (simulación demo +8 semanas)');

  if (pe) push(a ? 'ajuste' : 'seguimiento', a ? `Plan v${pe.version} propuesto · pendiente de aprobación` : 'Plan pendiente de aprobación', 'plan');

function lineChart(points, o = {}) {
  const W = 640, H = o.h || 230, L = 46, R = 16, T = 16, B = 30;
  const pts = points.slice().sort(sortByDate).filter(d => d.value != null && d.value !== '' && !isNaN(d.value));
  if (!pts.length) return `<div class="empty" style="padding:30px"><p>Sin mediciones registradas para esta variable.</p></div>`;
  const ts = pts.map(d => new Date(d.date + 'T12:00:00').getTime());
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1) { t0 -= DAY_MS * 15; t1 += DAY_MS * 15; }
  const vals = pts.map(d => +d.value).concat([o.low, o.high].filter(v => v != null && v !== '').map(Number));
  let y0 = Math.min(...vals), y1 = Math.max(...vals); const pv = (y1 - y0) * 0.18 || Math.abs(y1) * 0.2 || 1; y0 -= pv; y1 += pv;
  if (o.min0 && y0 < 0) y0 = 0;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${num(v, Math.abs(y1 - y0) < 10 ? 1 : 0)}</text>`; }
  let band = '';
  if ((o.low != null && o.low !== '') || (o.high != null && o.high !== '')) {
    const lo = o.low != null && o.low !== '' ? +o.low : y0, hi = o.high != null && o.high !== '' ? +o.high : y1;
    band = `<rect class="band" x="${L}" width="${W - L - R}" y="${y(Math.min(hi, y1))}" height="${Math.max(0, y(Math.max(lo, y0)) - y(Math.min(hi, y1)))}" rx="4"/>`;
  }
  let marks = '';
  (o.marks || []).forEach(mk => { const t = new Date(mk.date + 'T12:00:00').getTime(); if (t < t0 || t > t1) return; marks += `<line class="mark-l" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}"/><text class="mark-t" x="${x(t) + 4}" y="${T + 10}">${esc(mk.label)}</text>`; });
  const path = pts.map((d, i) => `${i ? 'L' : 'M'}${x(ts[i]).toFixed(1)},${y(+d.value).toFixed(1)}`).join(' ');
  const area = `${path} L${x(ts[ts.length - 1]).toFixed(1)},${H - B} L${x(ts[0]).toFixed(1)},${H - B} Z`;
  const step = Math.ceil(pts.length / 7);
  const xl = pts.map((d, i) => i % step === 0 || i === pts.length - 1 ? `<text class="ax" x="${x(ts[i])}" y="${H - 9}" text-anchor="middle">${fmtDate(d.date).slice(0, 5)}</text>` : '').join('');
  const dots = pts.map((d, i) => `<circle class="pt" cx="${x(ts[i])}" cy="${y(+d.value)}" r="4"><title>${fmtDate(d.date)} · ${num(+d.value, 2)} ${esc(o.unit || '')}</title></circle>`).join('');
  const id = 'gr' + Math.random().toString(36).slice(2, 7);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Gráfico')}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#83A99B" stop-opacity=".28"/><stop offset="1" stop-color="#83A99B" stop-opacity="0"/></linearGradient></defs>${g}${band}${marks}<path class="area" d="${area}" fill="url(#${id})"/><path class="line" d="${path}"/>${dots}${xl}</svg></div>`;
}
function sparkline(points, w = 110, h = 28) {
  const pts = points.filter(hasVal); if (pts.length < 2) return `<span class="xs muted">—</span>`;
  const vs = pts.map(d => +d.value), a = Math.min(...vs), b = Math.max(...vs), r = b - a || 1;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (p.value - a) / r * (h - 6)).toFixed(1)}`).join(' ');
  const lx = w - 2, ly = h - 3 - (vs[vs.length - 1] - a) / r * (h - 6);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="#83A99B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="#164E49"/></svg>`;
}
function barChart(labels, values, o = {}) {
  const W = 640, H = o.h || 200, L = 30, R = 10, T = 14, B = 28, max = Math.max(3, Math.ceil(Math.max(...values, 1) / 3) * 3);
  const bw = (W - L - R) / labels.length; let s = '';
  for (let i = 0; i <= 3; i++) { const v = max * i / 3, yy = T + (1 - i / 3) * (H - T - B); s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 8}" y="${yy + 3.5}" text-anchor="end">${Math.round(v)}</text>`; }
  labels.forEach((l, i) => {
    const h = values[i] / max * (H - T - B), xx = L + i * bw + bw * 0.25, yy = H - B - h;
    s += `<rect class="bar-r" x="${xx}" y="${yy}" width="${bw * 0.5}" height="${h}" rx="6"><animate attributeName="height" from="0" to="${h}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${H - B}" to="${yy}" dur=".7s" fill="freeze"/><title>${esc(l)}: ${values[i]}</title></rect><text class="ax" x="${xx + bw * 0.25}" y="${H - 9}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Gráfico de barras')}">${s}</svg></div>`;
}

const SYMPTOMS = [['abdPain', 'Dolor abdominal'], ['diarrhea', 'Diarrea'], ['bloating', 'Distensión'], ['nausea', 'Náuseas'], ['appetiteLoss', 'Pérdida de apetito'], ['earlySatiety', 'Saciedad precoz'], ['eatingDifficulty', 'Dificultad para comer']];

function priorityCards(p) {
  const r = generateRecommendations(p);
  if (!r.supported) return '<p class="muted small">Sin módulo de recomendaciones para este diagnóstico.</p>';
  const cards = [];
  if (r.urgent) cards.push(['alert', 'Evaluación médica urgente', 'Signos de alarma registrados. Propuestas dietarias suspendidas.', 'urg']);
  const has = id => r.recs.find(x => x.id === id);
  if (has('G-nutricion')) cards.push(['apple', 'Riesgo nutricional', has('G-nutricion').triggers.join(' · '), 'high']);
  if (has('F-estenosis')) cards.push(['alert', 'Textura y consistencia', 'Evaluación individual por estenosis.', 'high']);
  if (has('A-b12')) cards.push(['flask', 'Vitamina B12', has('A-b12').title, has('A-b12').priority === 'alta' ? 'high' : 'ok']);
  if (has('B-vitd')) cards.push(['flask', 'Vitamina D', 'Por debajo del rango del laboratorio.', 'ok']);
  if (has('C-hierro')) cards.push(['flask', 'Hierro', has('C-hierro').title, 'high']);
  const sx = SYMPTOMS.filter(([k]) => +p.nutrition.symptoms[k] >= 2).map(([, l]) => l);
  if (sx.length) cards.push(['pulse', 'Síntomas a monitorear', sx.join(', ') + ' (moderado/intenso).', 'ok']);
  if (has('E-remision')) cards.push(['check', 'Mantenimiento', 'Patrón equilibrado y variado, adaptado a tolerancia.', 'ok']);
  if (r.missing.length) cards.push(['info', 'Información insuficiente', r.missing.slice(0, 3).join(', ') + (r.missing.length > 3 ? '…' : ''), 'nd']);
  if (!cards.length) return '<p class="muted small">No se identificaron prioridades con los datos actuales.</p>';
  return `<div class="prio-grid">${cards.map(([ic, t, d, c]) => `<div class="prio"><div class="h"><span class="chip ${c}" style="padding:4px">${icon(ic, 14)}</span>${esc(t)}</div><p>${esc(d)}</p></div>`).join('')}</div>`;
}

}

  }).join('');
}

function reportPatient(owner, plan) {
  if (!plan || !plan.inputSnapshot) return owner;
  return Object.assign(clone(plan.inputSnapshot), { id: owner.id, plans: owner.plans, report: owner.report, audit: owner.audit, reviews: plan.inputSnapshot.reviews || {} });
}
function reportSummaryText(owner) {
  const plan = selectedPlan(owner), p = reportPatient(owner, plan), r = generateRecommendations(p);
  const L = ['CROHN-PRECISION · Informe del plan (prototipo educativo, datos sintéticos)', `Paciente ${p.code} · ${p.age ?? '—'} años · ${DX[p.diagnosis]}`];
  if (plan) {
    L.push(`Plan v${plan.version} · ${PLAN_STATUS[planDisplayStatus(plan)].label} · ciclo ${pad(plan.cycle)} · ${fmtDate(plan.startDate)} → reevaluación ${fmtDate(plan.reevalDate)}`, `Profesional: ${plan.approvedBy || plan.professional}`, '', 'OBJETIVOS');
    plan.objectives.forEach(o => L.push(`- ${o.title} (${OBJ_STATUS[objStatus(p, o, plan)].label}) · objetivo ${o.target.label}`));
    L.push('', `ALIMENTACIÓN: ${NUT_MODE[plan.nutrition.mode].label} — ${plan.nutrition.summary}`, '', 'SUPLEMENTACIÓN');
    plan.supplements.forEach(i => L.push(`- ${i.name}: ${PHASE[i.phase].label} · ${ITEM_REVIEW[i.review].label}${i.intervention && i.intervention.route ? ' · vía ' + i.intervention.route : ''}`));
    L.push('', 'CONTROLES'); plan.monitoring.forEach(m => L.push(`- ${m.what}: ${fmtDate(m.when)}`));
    if (plan.changes.length) { L.push('', 'CAMBIOS IMPLEMENTADOS'); plan.changes.forEach(c => L.push(`- ${c.area}: ${c.fromLabel} → ${c.toLabel}`)); }
  } else if (!r.supported) L.push('Sin módulo de recomendaciones validado para este diagnóstico.');
  L.push('', plan && plan.inputSnapshot ? 'DATOS CONSERVADOS AL GENERAR LA PROPUESTA: ' + fmtDate(plan.createdAt) : 'EVALUACIÓN ACTUAL SEPARADA: este plan histórico no conserva la entrada completa; no se atribuyen estos genotipos a su generación.');
  geneticInterpretations(p).forEach(x => L.push(`${RESULT_GROUPS[x.resultGroup]} · ${x.gene} ${x.rs} ${x.genotype}: ${x.interpretation} ${x.decision}`));
  if (p.report.notes) L.push('', `Observaciones: ${p.report.notes}`);
  L.push('', 'No apto para decisiones clínicas reales. El sistema propone; el profesional decide.');
  return L.join('\n');
}

function importFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || (d.type !== 'patient' && !Array.isArray(d.patients))) throw new Error('formato');
      const previous = state;
      const perform = () => {
        try {
          if (d.type === 'patient' && d.patient) {
            const src = clone(d.patient); src.id = uid(); if (byCode(src.code)) src.code += '-imp';
            const patient = normalizePatient(src);
            state.patients.push(patient); state.activeId = patient.id;
            logActivity(`Paciente ${patient.code} importado`, 'upload');
          } else if (Array.isArray(d.patients)) {
            const settings = Object.assign(defaultSettings(), d.settings || {});
            ANALYTES.forEach(a => { if (!settings.ranges[a.key]) settings.ranges[a.key] = {low:a.low, high:a.high}; });
            const candidate = { version: 2, patients: [], activeId:d.activeId, settings, activity:Array.isArray(d.activity)?d.activity:[] };
            state = candidate;
            candidate.patients = d.patients.map(normalizePatient);
            if (!candidate.patients.find(p=>p.id===candidate.activeId)) candidate.activeId = candidate.patients[0]?.id || null;
            downloadFile('CROHN_PRECISION_respaldo_pre_importacion_'+TODAY+'.json',JSON.stringify({type:'full', ...previous},null,2));
          } else throw new Error('formato');
          ui.storageBlocked=false; ui.planId=null; save(); render(); toast('Datos importados correctamente');
        } catch(err) { state=previous; render(); toast('No se importó: estructura de datos no válida. La sesión anterior se conserva.','error'); }
      };
      if (Array.isArray(d.patients)) confirmModal('Importar conjunto de pacientes', `El archivo contiene ${d.patients.length} pacientes y reemplazará esta sesión. Se solicitará una copia de seguridad de los datos actuales antes del reemplazo.`, 'Respaldar e importar', perform, false);
      else perform();
    } catch(err) { toast('El archivo no tiene un formato válido de CROHN-PRECISION.','error'); }
  };
  rd.readAsText(file);
}
function defaultSettings() { return { doctor: 'Dr. Martínez', role: 'Gastroenterología · Nutrición clínica', ranges: Object.fromEntries(ANALYTES.map(a => [a.key, { low: a.low, high: a.high }])), demoMode: true }; }

function init() {
