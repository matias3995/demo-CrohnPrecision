  if (ui.storageWarning) return `<div class="notice urg" style="margin-bottom:18px">${icon('alert')}<div><b>El almacenamiento requiere atención.</b> ${esc(ui.storageWarning)} Exportá tus datos antes de cerrar.</div></div>`;
  if (!pitchNeedsRefresh()) return '';
  return `<div class="notice sand no-print" style="margin-bottom:18px">${icon('info')}<div><b>Se conservaron los datos guardados.</b> Para ver los casos actualizados podés iniciar la demo temporal. Para reemplazarlos, exportá primero tu JSON y usá «Restaurar datos de demostración» en Configuración. Los planes anteriores permanecen intactos.<div class="row" style="margin-top:8px"><button class="btn btn-soft btn-sm" data-action="pitch-start">Ver demo temporal</button><button class="btn btn-ghost btn-sm" data-nav="configuracion">Gestionar datos</button></div></div></div>`;
}
function geneticInsightCard(x, compact = false) {
  const text = a => Array.isArray(a) ? a.join(' · ') : (EVID[a] ? EVID[a].label : (a || ''));
  return `<article class="insight-card ${x.resultGroup === 'B' ? 'functional' : 'exploratory'}" data-insight="${esc(x.id)}"><div class="row between"><b>${esc(x.gene)} <span class="mono">${esc(x.rs)} · ${esc(x.genotype)}</span></b>${chip(x.resultGroup === 'B' ? 'Funcional · contextual' : 'Exploratorio', x.resultGroup === 'B' ? 'ok' : 'interp')}</div><p>${esc(x.interpretation)}</p><p class="small"><b>Decisión:</b> ${esc(x.decision)}</p>${compact ? '' : `<dl class="insight-meta"><div><dt>Vía / nutriente</dt><dd>${esc(x.pathway)} · ${esc(x.nutrient)}</dd></div><div><dt>Evidencia y alcance</dt><dd>${esc(text(x.evidence))}</dd></div><div><dt>Incertidumbre</dt><dd>${esc(text(x.uncertainty))}</dd></div><div><dt>Datos a evaluar</dt><dd>${esc(text(x.dataNeeded))}</dd></div></dl><div class="row">${(x.refs || []).map(refLink).join('')}</div>`}</article>`;
}
function geneticEvidencePanel(p, compact = false) {
  const items = geneticInterpretations(p);
  return `<section class="card" id="genetic-evidence" style="margin:18px 0"><div class="card-h"><div><div class="eyebrow">Panel común · interpretación del genotipo registrado</div><h3>Genética funcional e interacciones gen–nutriente en investigación</h3></div></div><p class="small muted" style="margin-bottom:12px">El grupo B puede orientar una evaluación contextual. El grupo C formula hipótesis; no prescribe alimentos ni suplementos. Las prioridades clínicas del grupo A se mantienen.</p><div class="stack">${items.length ? items.map(x => geneticInsightCard(x, compact)).join('') : '<p class="muted">Sin genotipos del panel común registrados. No se infieren resultados normales.</p>'}</div></section>`;
}
function comparisonModel(p) {
  const without = clone(p); without.genetics = {};
  const clinical = generateRecommendations(without);
  const integrated = generateRecommendations(p);
  return { clinical, integrated, insights: geneticInterpretations(p) };
}
function clinicalFacts(p) {
  const values = [['Peso', currentWeight(p) ? num(currentWeight(p).value) + ' kg' : 'Sin dato'], ['Pérdida de peso', p.nutrition.risk.weightLossPct == null ? 'Sin dato' : num(p.nutrition.risk.weightLossPct) + ' %'], ['Calprotectina', LV(p,'calpro') == null ? 'Sin dato' : num(LV(p,'calpro')) + ' µg/g'], ['PCR', LV(p,'pcr') == null ? 'Sin dato' : num(LV(p,'pcr')) + ' mg/L']];
  return `<div class="pitch-facts">${values.map(([label,value]) => `<div><span>${label}</span><b>${value}</b></div>`).join('')}</div>`;
}
function clinicalList(p, limit = 5) {
  const m = comparisonModel(p), recs = m.clinical.recs.filter(x => x.category !== 'genetica' && x.category !== 'datos');
  return `<ul class="pitch-list">${recs.slice(0,limit).map(x => `<li><b>${esc(x.title)}</b><span>${esc(x.action)}</span></li>`).join('')}</ul>${recs.length > limit ? `<details><summary class="linkbtn">Ver ${recs.length-limit} hallazgos adicionales</summary><ul class="pitch-list">${recs.slice(limit).map(x => `<li><b>${esc(x.title)}</b><span>${esc(x.action)}</span></li>`).join('')}</ul></details>` : ''}`;
}
function comparisonDecision(p) {
  const { clinical, integrated, insights } = comparisonModel(p);
  if (integrated.urgent) return `<div class="notice urg"><b>Prioridad absoluta: evaluación médica urgente. Cualquier propuesta dietaria queda suspendida.</b></div>`;
  const functional = insights.find(x => x.resultGroup === 'B');
  const priorityIds=['G-nutricion','F-estenosis','C-hierro','E-remision','LAC-clinica'];
  const priorities=priorityIds.map(id=>clinical.recs.find(x=>x.id===id)).filter(Boolean).slice(0,3).map(x=>x.title);
  const exploratory=insights.filter(x=>x.resultGroup==='C').map(x=>x.gene);
  return `<p><b>Se mantienen:</b> ${esc(priorities.length ? priorities.join(' · ')+'.' : 'las prioridades detectadas con clínica, analítica, ingesta y tolerancia.')}</p><p><b>Aporte funcional:</b> ${esc(functional ? functional.decision : 'Sin genotipo interpretable de persistencia de lactasa registrado.')}</p><p><b>En investigación:</b> ${exploratory.length ? esc(exploratory.join(', '))+' aportan hipótesis de interacción con grasas. Completar el registro de fuentes, porciones, frecuencia y síntomas; sin ratio omega-6/omega-3 ni suplementos por genotipo.' : 'Sin variantes exploratorias del panel común registradas.'}</p><p class="small muted">El aporte informativo no demuestra una mejoría clínica. Registrar la evolución futura y revisar las propuestas con el profesional.</p>`;
}
function comparisonTable(patients, compact = false) {
  return `<div class="comparison-grid">${patients.map(p => `<article class="comparison-patient card"><div class="row between"><h2>${esc(p.code)}${p.demoName ? ' · '+esc(p.demoName) : ''}</h2>${activityChip(p)}</div><p class="muted small">${p.age} años · ${esc(p.sex)} · ${esc(p.clinical.location)} / ${esc(p.clinical.behavior)} · riesgo nutricional ${esc(p.nutrition.risk.malnutritionRisk)}</p>${clinicalFacts(p)}<section><div class="eyebrow">01 · Evaluación clínica y nutricional</div><h3>Sin utilizar genética</h3>${clinicalList(p,compact?3:5)}</section><section><div class="eyebrow">02 · Incorporación del panel</div><h3>Qué información añade</h3><div class="stack">${geneticInterpretations(p).map(x=>geneticInsightCard(x,true)).join('') || '<p>Panel común no registrado.</p>'}</div></section><section class="comparison-integrated"><div class="eyebrow">03 · Evaluación integrada</div><h3>Qué se mantiene y qué se investiga</h3>${comparisonDecision(p)}</section>${!demoSession ? `<button class="btn btn-soft" data-action="pitch-open-patient" data-id="${p.id}">Abrir ficha de ${esc(p.code)}</button>` : ''}</article>`).join('')}</div>`;
}
VIEWS.comparacion = () => {
  const patients = PITCH_CODES.map(byCode).filter(Boolean);
  return `${dataNotice()}<div class="page-head"><div><div class="eyebrow">Prototipo académico · pacientes simulados</div><h1>Con y sin genética</h1><p class="sub">CP-001 vs CP-004 · comparación calculada con los datos actuales de cada ficha.</p></div><button class="btn btn-primary" data-action="pitch-start">${icon('play',15)}Demo del pitch · 40 s</button></div><div class="notice info" style="margin-bottom:18px"><div><b>Una evaluación, tres niveles de evidencia.</b> A · clínica y nutrición. B · función genética con contexto. C · hipótesis exploratorias. No se comparan resultados de tratamientos ni beneficios demostrados.</div></div>${patients.length===2 ? comparisonTable(patients) : emptyState('users','Faltan casos de la comparación','Iniciá la demo temporal o restaurá los pacientes actualizados desde Configuración.')}`;
};
const PITCH_STEPS = [
  ['Dos pacientes, un diagnóstico', 'Las necesidades nutricionales surgen de la situación de cada persona.'],
  ['CP-001 · remisión confirmada', 'Alimentación suficiente y variada, sin pérdida de peso.'],
  ['Lactasa: genotipo + síntomas', 'CC orienta una evaluación; no confirma intolerancia sintomática.'],
  ['Una propuesta sin restricciones innecesarias', 'Evaluar tolerancia, conservar variedad y revisar calcio y vitamina D.'],
  ['CP-004 · Marcos', 'La actividad, la estenosis y la pérdida de peso cambian las prioridades.'],
  ['La clínica establece la prioridad', 'Evaluación nutricional especializada y revisión de analíticas.'],
  ['TNF e IL6 · hipótesis exploratorias', 'Caracterizar grasas consumidas; no prescribir una dieta por SNP.'],
  ['Una propuesta acorde con la situación clínica', 'Textura individualizada, requerimientos, anemia y micronutrientes.'],
  ['Qué aporta integrar la información', 'La genética complementa; su utilidad depende de la variante y la evidencia.']
];
const pitch = {
  active:false, playing:false, i:0, timer:null,
  start() { if(tour.active) tour.stop(); if(this.active) this.stop(); beginDemoSession('pitch'); this.active=true; this.i=0; this.playing=false; this.show(); },
  show() { clearTimeout(this.timer); ui.view='pitch'; render(); window.scrollTo({top:0,behavior:'instant'}); if(this.playing) this.timer=setTimeout(()=>{if(this.i<8){this.i++;this.show();}else{this.playing=false;this.show();}},4500); },
  play() { if(this.i===8) this.i=0; this.playing=!this.playing; this.show(); },
  move(delta) { this.playing=false; this.i=Math.max(0,Math.min(8,this.i+delta));this.show(); },
  stop() { clearTimeout(this.timer);this.playing=false;this.active=false;endDemoSession();render(); }
};
VIEWS.pitch = () => {
  if(!pitch.active) return VIEWS.comparacion();
  const a=byCode('CP-001'), b=byCode('CP-004'), p=pitch.i<4?a:b, step=PITCH_STEPS[pitch.i];
  const preview = x => `<article class="card pitch-profile"><div class="eyebrow">${esc(x.code)}${x.demoName ? ' · '+esc(x.demoName) : ''}</div><h2>${x.clinical.activity==='remision'?'En remisión':'Con Crohn activo'}</h2><div class="row">${activityChip(x)}${chip(x.clinical.behavior==='B2'?'Estenosis':'No estenosante',x.clinical.behavior==='B2'?'high':'soft')}</div><p>${x.age} años · ${esc(x.sex)} · ${esc(x.clinical.location)} / ${esc(x.clinical.behavior)}</p>${clinicalFacts(x)}</article>`;
  let body='';
  if(pitch.i===0) body=`<div class="comparison-grid">${[a,b].map(preview).join('')}</div><div class="pitch-message">Mismo diagnóstico. Diferentes prioridades nutricionales.</div>`;
  if(pitch.i===1) body=preview(a)+`<div class="card"><h3>Tolerancia alimentaria</h3><p>${esc(a.nutrition.foodsAssoc)}</p><p class="small muted">Síntomas compatibles con sospecha de intolerancia a lactosa; no confirmada.</p></div>`;
  if(pitch.i===2) body=geneticInterpretations(a).filter(x=>x.resultGroup==='B').map(x=>geneticInsightCard(x)).join('');
  if(pitch.i===3) body=`<div class="card"><div class="eyebrow">Propuesta pendiente de revisión</div>${clinicalList(a,4)}</div>`;
  if(pitch.i===4) body=preview(b)+`<div class="notice sand"><div><b>Ingesta reducida y riesgo nutricional alto.</b> Dolor, diarrea, distensión y disminución del apetito. No se asume que el genotipo explique la actividad.</div></div>`;
  if(pitch.i===5) body=`<div class="card">${clinicalFacts(b)}<p><b>Anemia en contexto inflamatorio:</b> ${esc(fmtLab(b,'hb'))} · ${esc(fmtLab(b,'ferritin'))} · ${esc(fmtLab(b,'tsat'))}.</p><p>Albúmina ${num(LV(b,'alb'))} g/dL: interpretar junto con inflamación y evaluación nutricional; no diagnostica desnutrición por sí sola.</p><div class="notice urg" style="margin-top:14px">Si aparecen signos de obstrucción: evaluación médica urgente.</div></div>`;
  if(pitch.i===6) body=`<div class="comparison-grid">${geneticInterpretations(b).filter(x=>['TNF','IL6'].includes(x.gene)).map(x=>geneticInsightCard(x,true)).join('')}</div><div class="card"><h3>Registro de grasas · ficticio</h3><p class="small">${esc(b.nutrition.fats)}</p><p class="small muted">No hay datos cuantitativos suficientes para calcular una relación omega-6/omega-3.</p></div>`;
  if(pitch.i===7) body=`<div class="card"><div class="eyebrow">Propuesta pendiente de revisión</div>${clinicalList(b,4)}</div>`;
  if(pitch.i===8) body=`<div class="comparison-grid">${[a,b].map(x=>`<div class="card"><h2>${esc(x.code)}${x.demoName?' · '+esc(x.demoName):''}</h2>${activityChip(x)}<div class="comparison-integrated">${comparisonDecision(x)}</div></div>`).join('')}</div><div class="pitch-message">Dos evaluaciones diferentes. Ningún beneficio clínico asumido.</div>`;
  return `<div class="pitch-screen"><div class="pitch-controls no-print"><div><b>Demo del pitch: CP-001 vs CP-004</b><span>Pacientes simulados · prototipo académico · sesión temporal</span></div><div class="row"><button class="btn btn-ghost btn-sm" data-action="pitch-prev" ${pitch.i===0?'disabled':''} aria-label="Paso anterior">${icon('back',14)}</button><button class="btn btn-primary btn-sm" data-action="pitch-play">${icon('play',14)}${pitch.playing?'Pausar':'Reproducir · 40 s'}</button><button class="btn btn-ghost btn-sm" data-action="pitch-next" ${pitch.i===8?'disabled':''} aria-label="Paso siguiente">${icon('chevron',14)}</button><button class="btn btn-soft btn-sm" data-action="pitch-exit">Salir</button></div></div><div class="pitch-progress">${PITCH_STEPS.map((x,i)=>`<button data-action="pitch-step" data-id="${i}" class="${i===pitch.i?'on':i<pitch.i?'done':''}" aria-label="Paso ${i+1}: ${esc(x[0])}"></button>`).join('')}</div><div class="page-head"><div><div class="eyebrow">Paso ${pitch.i+1} de 9 · A clínica / B función / C exploración</div><h1>${esc(step[0])}</h1><p class="sub">${esc(step[1])}</p></div></div><div class="stack pitch-body">${body}</div></div>`;
};
function planDataNotice(p,plan) {
  if(!plan) return '';
  if(!plan.inputSnapshot) return `<div class="notice sand no-print" style="margin:14px 0"><div><b>Plan previo a la actualización.</b> Esta versión no conserva una copia completa de sus datos de entrada. Se mantiene intacta. La interpretación genética actual es una evaluación separada; revisá los datos y generá una nueva propuesta cuando corresponda.</div></div>`;
  return planInputsChanged(p,plan)?`<div class="notice sand no-print" style="margin:14px 0"><div><b>Hay datos distintos de los usados en esta propuesta.</b> El plan v${esc(plan.version)} conserva su contenido original. Revisá la evaluación actual antes de aprobar.<div class="row" style="margin-top:8px"><button class="btn btn-soft btn-sm" data-action="pitch-new-proposal">Crear nueva propuesta con los datos actuales</button></div></div></div>`:'';
}
function planInputsChanged(p,plan) {
  return !!plan.inputSnapshot && ['clinical','nutrition','genetics','labs','weight'].some(k=>JSON.stringify(p[k])!==JSON.stringify(plan.inputSnapshot[k]));
}
function newCurrentProposal(p) {
  const prev = p.plans.slice().sort((a,b)=>parseFloat(a.version)-parseFloat(b.version)).slice(-1)[0];
  const date = [TODAY,p.evalDate,...Object.values(p.labs).flat().map(m=>m.date),...p.followup.weight.map(m=>m.date)].filter(Boolean).sort().slice(-1)[0];
  const plan=buildPlan(p,{date,prev,professional:doctor(),reason:'Nueva evaluación con datos actuales; propuesta pendiente de aprobación'});
  p.plans.filter(x=>x.status==='pendiente').forEach(x=>{x.status='borrador'; addAudit(p,date,'Sistema',`Propuesta v${x.version} conservada como borrador anterior; no fue aprobada`);});
  p.plans.push(plan); addAudit(p,date,'Sistema',`Nueva propuesta v${plan.version} generada con los datos actuales`);
  ui.planId=plan.id; touch(p);save();go('plan');toast(`Propuesta v${plan.version} pendiente de revisión`);
}
const originalHome=VIEWS.inicio;
VIEWS.inicio=()=>`<section class="pitch-launch card"><div><div class="eyebrow">COIL CEU–UADE · pacientes simulados</div><h2>CP-001 vs CP-004: el aporte de la genética</h2><p>Remisión y sospecha de intolerancia a lactosa frente a actividad, estenosis y riesgo nutricional.</p></div><div class="row"><button class="btn btn-primary" data-action="pitch-start">${icon('play',16)}Demo del pitch: CP-001 vs CP-004</button><button class="btn btn-soft" data-nav="comparacion">Con y sin genética</button></div></section>${dataNotice()}${originalHome()}`;
const originalGenetics=VIEWS.genetica;
VIEWS.genetica=()=>originalGenetics()+geneticEvidencePanel(activePatient());
const originalSummary=VIEWS.resumen;
VIEWS.resumen=()=>originalSummary()+`<div class="row" style="margin-top:18px"><button class="btn btn-soft" data-nav="comparacion">Comparar evaluación con y sin genética</button></div>`+geneticEvidencePanel(activePatient(),true);
const originalPlan=VIEWS.plan;
VIEWS.plan=()=>planDataNotice(activePatient(),selectedPlan(activePatient()))+originalPlan();
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b || b.disabled)return;
  const action=b.dataset.action;
  if(action==='pitch-start') pitch.start();
  if(action==='pitch-exit') pitch.stop();
  if(action==='pitch-play') pitch.play();
  if(action==='pitch-prev') pitch.move(-1);
  if(action==='pitch-next') pitch.move(1);
  if(action==='pitch-step'){pitch.playing=false;pitch.i=Number(b.dataset.id);pitch.show();}
  if(action==='pitch-open-patient'){state.activeId=b.dataset.id;ui.planId=null;save();go('resumen');}
  if(action==='pitch-new-proposal')newCurrentProposal(activePatient());
});
document.addEventListener('keydown',e=>{
  if(!pitch.active || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'){e.preventDefault();pitch.move(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();pitch.move(-1);}
  if(e.key==='Escape')pitch.stop();
});

init();

</script>
